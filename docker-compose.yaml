services:
    prometheus:
        image: prom/prometheus
        container_name: raspberrypi-prometheus
        ports:
            - "9090:9090"
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=3d"
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
            - prometheus_data:/prometheus
        extra_hosts:
            - "host.docker.internal:host-gateway"
        restart: unless-stopped

    grafana:
        image: grafana/grafana
        container_name: raspberrypi-grafana
        ports:
            - "3000:3000"
        volumes:
            - grafana_data:/var/lib/grafana
        restart: unless-stopped
    
    node-exporter:
        image: prom/node-exporter
        container_name: raspberrypi-node-exporter
        ports:
            - "9100:9100"
        command:
            - "--path.rootfs=/host"
        volumes:
            - "/:/host:ro,rslave"
        restart: unless-stopped

volumes:
    prometheus_data:
    grafana_data:
